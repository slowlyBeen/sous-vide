<!DOCTYPE html>
<html lang="ko">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Sous-vide Master | Local Recipe Vault</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link href="https://fonts.googleapis.com/css2?family=Noto+Sans+KR:wght@300;400;500;700;900&family=Playfair+Display:wght@700;900&display=swap" rel="stylesheet">

    <style>
        :root {
            --brand-primary: #f97316;
            --brand-dark: #0f172a;
            --bg-soft: #f8fafc;
        }
        body {
            font-family: 'Noto Sans KR', sans-serif;
            background-color: var(--bg-soft);
            color: #334155;
            -webkit-font-smoothing: antialiased;
        }
        .font-display { font-family: 'Playfair Display', serif; }

        /* Custom Scrollbar */
        ::-webkit-scrollbar { width: 6px; }
        ::-webkit-scrollbar-track { background: transparent; }
        ::-webkit-scrollbar-thumb { background: #cbd5e1; border-radius: 10px; }

        /* Card & Effects */
        .recipe-card {
            transition: all 0.4s cubic-bezier(0.175, 0.885, 0.32, 1.275);
            background: white;
            border: 1px solid rgba(226, 232, 240, 0.6);
        }
        .recipe-card:hover {
            transform: translateY(-10px);
            box-shadow: 0 25px 50px -12px rgba(0, 0, 0, 0.08);
            border-color: var(--brand-primary);
        }

        .glass-header {
            background: rgba(255, 255, 255, 0.85);
            backdrop-filter: blur(10px);
            -webkit-backdrop-filter: blur(10px);
        }

        /* Recipe Content Rendering */
        .recipe-view-area { line-height: 1.8; color: #475569; }
        .recipe-view-area h1 { font-size: 2.25rem; font-weight: 900; margin-bottom: 1.5rem; color: var(--brand-dark); }
        .recipe-view-area h2 {
            font-size: 1.5rem; font-weight: 700; margin-top: 2.5rem; margin-bottom: 1rem;
            color: var(--brand-dark); display: flex; align-items: center;
        }
        .recipe-view-area h2::after {
            content: ''; flex: 1; height: 1px; background: #e2e8f0; margin-left: 1rem;
        }
        .recipe-view-area ul { margin-bottom: 1.5rem; }
        .recipe-view-area li {
            margin-bottom: 0.75rem; padding-left: 1.5rem; position: relative;
        }
        .recipe-view-area li::before {
            content: '→'; position: absolute; left: 0; color: var(--brand-primary); font-weight: bold;
        }
        .recipe-view-area strong { color: var(--brand-dark); font-weight: 700; background: linear-gradient(120deg, #ffedd5 0%, #ffedd5 100%); background-repeat: no-repeat; background-size: 100% 0.3em; background-position: 0 88%; }

        @keyframes fadeIn {
            from { opacity: 0; transform: translateY(10px); }
            to { opacity: 1; transform: translateY(0); }
        }
        .animate-fade-in { animation: fadeIn 0.5s ease-out forwards; }
    </style>

    <script>
        // Local Storage를 이용한 레시피 관리 시스템
        let allRecipes = [];
        let currentPage = 1;
        const itemsPerPage = 6;

        // 초기 데이터 로드
        window.onload = () => {
            const savedData = localStorage.getItem('sous_vide_recipes');
            if (savedData) {
                allRecipes = JSON.parse(savedData);
            }
            renderUI();
        };

        const saveToLocal = () => {
            localStorage.setItem('sous_vide_recipes', JSON.stringify(allRecipes));
            renderUI();
        };

        const renderUI = () => {
            const grid = document.getElementById('recipe-grid');
            const startIndex = (currentPage - 1) * itemsPerPage;
            const paginated = allRecipes.slice(startIndex, startIndex + itemsPerPage);

            if (allRecipes.length === 0) {
                grid.innerHTML = `
                    <div class="col-span-full py-32 text-center">
                        <div class="inline-flex items-center justify-center w-24 h-24 bg-orange-50 rounded-full mb-6">
                            <span class="text-5xl">🍳</span>
                        </div>
                        <h3 class="text-2xl font-bold text-slate-800">보관함이 비어있습니다</h3>
                        <p class="text-slate-500 mt-2 max-w-xs mx-auto">최고의 수비드 레시피를 추가해 나만의 요리책을 만들어보세요.</p>
                        <button onclick="openModal('add-modal')" class="mt-8 px-8 py-3 bg-slate-900 text-white rounded-2xl font-bold hover:bg-orange-600 transition-all shadow-lg">첫 레시피 추가</button>
                    </div>
                `;
            } else {
                grid.innerHTML = paginated.map((recipe, idx) => `
                    <div class="recipe-card rounded-[2.5rem] p-8 flex flex-col h-full cursor-pointer animate-fade-in shadow-sm" style="animation-delay: ${idx * 0.1}s" onclick="viewRecipe('${recipe.id}')">
                        <div class="flex justify-between items-start mb-6">
                            <span class="text-[10px] font-black tracking-[0.2em] text-orange-500 uppercase border-b-2 border-orange-200 pb-1 italic">Local Collection</span>
                            <button onclick="event.stopPropagation(); deleteRecipe('${recipe.id}')" class="text-slate-200 hover:text-red-500 transition-colors p-1">
                                <svg class="w-5 h-5" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M19 7l-.867 12.142A2 2 0 0116.138 21H7.862a2 2 0 01-1.995-1.858L5 7m5 4v6m4-6v6m1-10V4a1 1 0 00-1-1h-4a1 1 0 00-1 1v3M4 7h16"></path></svg>
                            </button>
                        </div>
                        <h3 class="text-2xl font-black text-slate-900 mb-4 leading-tight font-display line-clamp-2 uppercase tracking-tight">${recipe.title}</h3>
                        <div class="text-slate-500 text-sm line-clamp-3 mb-8 leading-relaxed flex-grow">
                            ${recipe.content ? recipe.content.replace(/<[^>]*>/g, '').substring(0, 150) : ''}...
                        </div>
                        <div class="flex items-center text-slate-900 font-black text-[10px] tracking-[0.2em] uppercase group">
                            <span>Read Recipe</span>
                            <div class="ml-3 w-6 h-[2px] bg-slate-200 group-hover:w-10 group-hover:bg-orange-500 transition-all"></div>
                        </div>
                    </div>
                `).join('');
            }
            renderPagination();
        };

        const renderPagination = () => {
            const totalPages = Math.ceil(allRecipes.length / itemsPerPage);
            const container = document.getElementById('pagination');
            if (totalPages <= 1) { container.innerHTML = ''; return; }

            let html = `<div class="flex items-center space-x-3 bg-white p-2 rounded-[1.5rem] shadow-sm border border-slate-100">`;
            for (let i = 1; i <= totalPages; i++) {
                html += `
                    <button onclick="changePage(${i})" class="w-10 h-10 rounded-xl flex items-center justify-center font-bold transition-all ${currentPage === i ? 'bg-orange-500 text-white shadow-lg' : 'text-slate-400 hover:text-slate-900'}">
                        ${i}
                    </button>
                `;
            }
            html += `</div>`;
            container.innerHTML = html;
        };

        window.changePage = (p) => { currentPage = p; renderUI(); window.scrollTo({top: 0, behavior:'smooth'}); };

        // CRUD 기능
        window.addRecipe = (event) => {
            event.preventDefault();
            const title = document.getElementById('recipe-title').value;
            const content = document.getElementById('recipe-content').value;

            const newRecipe = {
                id: Date.now().toString(),
                title: title,
                content: content,
                createdAt: new Date().toISOString()
            };

            allRecipes.unshift(newRecipe);
            saveToLocal();
            closeModal('add-modal');
            document.getElementById('add-recipe-form').reset();
        };

        window.deleteRecipe = (id) => {
            if (confirm('이 레시피를 영구적으로 삭제하시겠습니까? (로컬 저장소에서 삭제됩니다)')) {
                allRecipes = allRecipes.filter(r => r.id !== id);
                saveToLocal();
            }
        };

        window.viewRecipe = (id) => {
            const r = allRecipes.find(x => x.id === id);
            if (r) {
                document.getElementById('view-title').innerText = r.title;
                document.getElementById('view-content').innerHTML = r.content;
                openModal('view-modal');
            }
        };

        // 모달 관리
        window.openModal = (id) => {
            const m = document.getElementById(id);
            m.classList.remove('hidden');
            m.classList.add('flex');
            document.body.style.overflow = 'hidden';
        };

        window.closeModal = (id) => {
            document.getElementById(id).classList.add('hidden');
            document.getElementById(id).classList.remove('flex');
            document.body.style.overflow = 'auto';
        };

        // 데이터 백업 기능
        window.exportData = () => {
            const dataStr = JSON.stringify(allRecipes, null, 2);
            const blob = new Blob([dataStr], {type: "application/json"});
            const url = URL.createObjectURL(blob);
            const a = document.createElement('a');
            a.href = url;
            a.download = `sous-vide-recipes-backup-${new Date().toISOString().slice(0,10)}.json`;
            a.click();
        };
    </script>
</head>
<body class="selection:bg-orange-100 selection:text-orange-900">

<!-- Header Navigation -->
<nav class="glass-header sticky top-0 z-40 border-b border-slate-100 h-24">
    <div class="max-w-7xl mx-auto px-6 md:px-12 h-full flex justify-between items-center">
        <div class="flex items-center gap-4">
            <div class="w-12 h-12 bg-slate-900 rounded-2xl flex items-center justify-center shadow-xl">
                <svg class="w-6 h-6 text-white" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2.5" d="M13 10V3L4 14h7v7l9-11h-7z"></path></svg>
            </div>
            <h1 class="text-2xl font-black text-slate-900 tracking-tighter font-display uppercase">Sous-vide <span class="text-orange-500">Master</span></h1>
        </div>
        <div class="flex items-center gap-3">
            <button onclick="exportData()" class="hidden sm:flex items-center px-4 py-2 text-slate-400 hover:text-slate-900 font-bold text-xs uppercase tracking-widest transition-colors">
                Backup
            </button>
            <button onclick="openModal('add-modal')" class="group relative px-6 md:px-8 py-3 bg-orange-500 text-white rounded-2xl font-bold overflow-hidden shadow-lg shadow-orange-100 hover:shadow-orange-200 transition-all">
                    <span class="relative z-10 flex items-center">
                        <svg class="w-5 h-5 mr-2" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="3" d="M12 4v16m8-8H4"></path></svg>
                        New Recipe
                    </span>
                <div class="absolute inset-0 bg-slate-900 translate-y-full group-hover:translate-y-0 transition-transform duration-300"></div>
            </button>
        </div>
    </div>
</nav>

<!-- Main Content -->
<main class="max-w-7xl mx-auto px-6 md:px-12 py-16">
    <div class="mb-20">
        <h2 class="text-6xl md:text-8xl font-black text-slate-900 mb-6 leading-[0.95] font-display">
            Precision <br/> <span class="text-orange-500 italic">Local Vault.</span>
        </h2>
        <div class="h-1 w-24 bg-orange-500 mb-8 rounded-full"></div>
    </div>

    <!-- Recipe Grid -->
    <div id="recipe-grid" class="grid grid-cols-1 md:grid-cols-2 lg:grid-cols-3 gap-10">
        <!-- Loading indicator (Actually instant for local) -->
    </div>

    <!-- Pagination -->
    <div id="pagination" class="mt-20 flex justify-center"></div>
</main>

<!-- Modal: Add -->
<div id="add-modal" class="fixed inset-0 bg-slate-900/40 backdrop-blur-md z-50 hidden items-center justify-center p-4">
    <div class="bg-white rounded-[3rem] w-full max-w-2xl shadow-2xl overflow-hidden animate-fade-in border border-slate-100">
        <div class="p-10 border-b border-slate-50 flex justify-between items-center bg-slate-50/30">
            <h3 class="text-3xl font-black text-slate-900 font-display italic text-center sm:text-left">Create Entry</h3>
            <button onclick="closeModal('add-modal')" class="text-slate-400 hover:text-slate-900 transition-colors">
                <svg class="w-8 h-8" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M6 18L18 6M6 6l12 12"></path></svg>
            </button>
        </div>
        <form id="add-recipe-form" onsubmit="addRecipe(event)" class="p-10 space-y-8">
            <div>
                <label class="block text-xs font-black text-slate-400 uppercase tracking-widest mb-3">Recipe Title</label>
                <input type="text" id="recipe-title" required class="w-full px-0 py-4 border-b-2 border-slate-100 focus:border-orange-500 outline-none transition-all font-bold text-2xl text-slate-900 placeholder:text-slate-200" placeholder="예: 72시간 저온 조리 갈비찜">
            </div>
            <div>
                <label class="block text-xs font-black text-slate-400 uppercase tracking-widest mb-3">Content (Gems HTML)</label>
                <textarea id="recipe-content" required rows="8" class="w-full p-6 bg-slate-50 rounded-3xl border-none focus:ring-4 focus:ring-orange-100 outline-none transition-all font-mono text-sm leading-relaxed" placeholder="Gems에서 얻은 HTML 코드를 여기에 붙여넣으세요..."></textarea>
            </div>
            <div class="flex gap-4 pt-4">
                <button type="button" onclick="closeModal('add-modal')" class="flex-1 py-5 rounded-2xl text-slate-400 font-bold hover:bg-slate-50 transition-all">Cancel</button>
                <button type="submit" class="flex-[2] py-5 bg-slate-900 text-white rounded-2xl font-black shadow-2xl hover:bg-orange-600 transition-all">Save to Browser</button>
            </div>
        </form>
    </div>
</div>

<!-- Modal: View -->
<div id="view-modal" class="fixed inset-0 bg-slate-900/60 backdrop-blur-xl z-50 hidden items-center justify-center p-4">
    <div class="bg-white rounded-[4rem] w-full max-w-4xl max-h-[90vh] shadow-2xl flex flex-col overflow-hidden animate-fade-in border border-slate-200">
        <div class="p-10 md:p-14 border-b border-slate-50 flex justify-between items-start bg-gradient-to-br from-orange-50/50 to-white">
            <div class="max-w-2xl">
                <div class="inline-block px-3 py-1 bg-white border border-orange-100 text-orange-600 text-[10px] font-black tracking-widest uppercase rounded-full mb-4 italic">Signature Collection</div>
                <h3 id="view-title" class="text-4xl md:text-5xl font-black text-slate-900 leading-[1.1] font-display tracking-tight uppercase">제목</h3>
            </div>
            <button onclick="closeModal('view-modal')" class="p-4 bg-white hover:bg-slate-100 rounded-3xl transition-all shadow-sm border border-slate-100 text-slate-400">
                <svg class="w-6 h-6" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2.5" d="M6 18L18 6M6 6l12 12"></path></svg>
            </button>
        </div>
        <div id="view-content" class="p-10 md:p-16 flex-1 overflow-y-auto recipe-view-area bg-white">
            <!-- Detail View -->
        </div>
        <div class="p-8 bg-slate-50 flex justify-center">
            <button onclick="closeModal('view-modal')" class="px-16 py-4 bg-slate-900 text-white rounded-2xl font-black hover:bg-orange-600 transition-all shadow-lg">Close Recipe</button>
        </div>
    </div>
</div>

<footer class="py-24 text-center">
    <div class="inline-block w-12 h-1 bg-slate-100 mb-8 rounded-full"></div>
    <p class="text-slate-300 text-[10px] font-black tracking-[0.3em] uppercase">© 2026 Sous-vide Master Local Repository</p>
</footer>

</body>
</html>
